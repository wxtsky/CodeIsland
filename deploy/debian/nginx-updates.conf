# ==============================================================================
# Nginx Virtual Host Configuration for CodeIsland Updates
# Optimized for Cloudflared Tunnel Ingress & Resumable Binary Streaming
# ==============================================================================

# Rate limiting zone for appcast polling
limit_req_zone $binary_remote_addr zone=codeisland_feed:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=codeisland_conn:10m;

server {
    listen 80;
    listen [::]:80;
    
    # Configure hostname to match your Cloudflare Tunnel routed domain
    server_name updates.yourdomain.com;

    root /var/www/codeisland-updates;
    index appcast.xml;

    # Trust Cloudflare Tunnel headers for accurate client IP logging and rate limiting
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for text and XML feeds (bypasses binary files)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/xml application/xml application/rss+xml;

    # --------------------------------------------------------------------------
    # 1. Sparkle Feed (appcast.xml) - Zero Cache & Rate Limited
    # --------------------------------------------------------------------------
    location = /appcast.xml {
        limit_req zone=codeisland_feed burst=20 nodelay;
        default_type application/xml;
        
        # Zero cache: clients must receive new release metadata immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # --------------------------------------------------------------------------
    # 2. Binary Installer (*.dmg) - High Throughput, Byte-Range & Aggressive Cache
    # --------------------------------------------------------------------------
    location ~* \.dmg$ {
        limit_conn codeisland_conn 10;
        default_type application/octet-stream;

        # Enable byte-range downloads (required for resumable downloads)
        max_ranges 50;

        # Zero-copy kernel sendfile
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # DMGs per version are immutable; aggressive caching is safe
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --------------------------------------------------------------------------
    # 3. Webhook Endpoint (Forward to local webhook daemon)
    # --------------------------------------------------------------------------
    location /api/deploy-webhook {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:9000/hooks/deploy-codeisland;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 4. Healthcheck Endpoint
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
